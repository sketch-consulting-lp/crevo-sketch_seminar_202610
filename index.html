<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="ハローワーク採用、求人票だけで終わっていませんか？応募につなげる『求人票×PR動画』の新しい活用法">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1;
    }

    .lp {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      overflow: hidden;
    }

    .section {
      position: relative;
      width: 100%;
      margin: 0;
      line-height: 0;
    }

    .section img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
    }

    .hotspot {
      position: absolute;
      display: block;
      overflow: hidden;
      z-index: 2;
      color: transparent;
      text-decoration: none;
      border-radius: clamp(18px, 4.4vw, 48px);
      outline-offset: 4px;
    }

    .hotspot:focus-visible {
      outline: 3px solid rgba(0, 145, 151, .85);
    }

    .hotspot--detail {
      left: 24.5%;
      top: 89%;
      width: 50.9%;
      height: 7%;
    }

    .hotspot--entry {
      left: 8.6%;
      top: 80%;
      width: 82.5%;
      height: 8.7%;
    }

    .btn-shine {
      position: absolute;
      top: 0;
      left: -120%;
      width: 55%;
      height: 100%;
      background: linear-gradient(
        118deg,
        transparent 0%, transparent 30%,
        rgba(255,255,255,.55) 50%,
        transparent 70%, transparent 100%
      );
      animation: btn-shine 3.8s infinite ease-in-out;
      pointer-events: none;
    }

    .hotspot--entry .btn-shine {
      animation-delay: 1.8s;
    }

    @keyframes btn-shine {
      0%   { left: -120%; opacity: 0; }
      10%  { opacity: 1; }
      40%  { left: 120%; opacity: 0; }
      100% { left: 120%; opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .btn-shine {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="lp">
    <section class="section" aria-label="セミナー概要">
      <img src="section1.png" alt="ハローワーク採用、求人票だけで終わっていませんか？応募につなげる求人票とPR動画の新しい活用法。2026年10月7日水曜日、11時から12時、オンラインZoom、参加無料。" width="948" height="1659">
      <a class="hotspot hotspot--detail" href="#cta" aria-label="詳しく見る">
        <span class="btn-shine" aria-hidden="true"></span>
      </a>
    </section>

    <section class="section" aria-label="ハローワーク動画掲載の案内">
      <img src="section2.png" alt="ハローワークに動画掲載が可能に。求人票だけでは伝えきれない職場の雰囲気や仕事のリアルをどう動画にすればよいか、採用にどう生かせばよいかを解説します。" width="948" height="1659">
    </section>

    <section class="section" aria-label="セミナー内容と登壇者">
      <img src="section3.png" alt="セミナーでお伝えする内容。求人票とPR動画の伝えるべき情報の違い、応募につなげる求人票の見直し方、職場の雰囲気の伝え方。登壇者は小川康太、渡辺源太氏。" width="948" height="1659">
    </section>

    <section class="section" aria-label="採用支援実績">
      <img src="section4.png" alt="ハローワークを活用した採用支援実績。福井県の製造業、福岡県の建設業、鹿児島県の病院で応募と採用につながった事例。" width="948" height="1659">
    </section>

    <section class="section" id="cta" aria-label="セミナー申込み">
      <img src="section5.png" alt="こんな方におすすめ。求人を掲載しているが応募が集まらない、求人票をどう改善すればいいかわからない、採用PR動画を試してみたい方へ。無料セミナーに申し込む。" width="948" height="1659">
      <a class="hotspot hotspot--entry" href="https://us06web.zoom.us/webinar/register/WN_6Qu4uPbYRICzMSlgNoARfg" target="_blank" rel="noopener" aria-label="無料セミナーに申し込む">
        <span class="btn-shine" aria-hidden="true"></span>
      </a>
    </section>
  </main>
</body>
</html>
